<style>

#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:200px 1fr;height:100vh}
header{grid-column:1/3;background:var(--hd);color:#fff;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:3px solid #d6001c}

header .date{font-size:11.5px;opacity:.85;line-height:1.2}
header .ctl{display:flex;gap:4px;align-items:center}
header button{background:var(--hd2);color:#fff;border:1px solid #2d5684;border-radius:3px;padding:5px 9px;cursor:pointer;font:600 12px system-ui}

header button:hover{background:#245487}
.badge{padding:3px 9px;border-radius:12px;font-weight:700;font-size:11.5px;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-wa{background:var(--wab);color:var(--wa)}.b-cr{background:var(--crb);color:var(--cr)}.b-in{background:var(--inb);color:var(--in)}.b-mu{background:#eef0f3;color:var(--mu)}
.sp{flex:1}
nav{background:#fff;border-right:1px solid var(--bd);overflow:auto;padding:6px 0}
nav a{display:flex;align-items:center;gap:8px;padding:6px 12px;color:var(--tx);text-decoration:none;cursor:pointer;border-left:3px solid transparent;font-size:12.5px}

nav a.act{background:var(--ac2);border-left-color:var(--ac);font-weight:600;color:var(--ac)}

main{overflow:auto;padding:12px 14px 30px}
h1{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2{font-size:13.5px;margin:14px 0 6px;color:var(--hd2)}

.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.kpi .v{font:600 22px var(--mono)}.kpi .l{font-size:11px;color:var(--mu)}
.kpi.wa{border-top-color:var(--wa)}.kpi.cr{border-top-color:var(--cr)}.kpi.ok{border-top-color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:#f1f4f8;text-align:left;font-weight:600;color:#33475b;padding:4px 6px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:3px 6px;border-bottom:1px solid #edf0f4;vertical-align:top}
tr.cl:hover td{background:#f5f9ff;cursor:pointer}
tr.dim td{color:#9aa5b1}
tr.rcr td{background:#fff5f4}tr.rwa td{background:#fffaf0}
.mono{font-family:var(--mono)}
.lb{display:inline-block;color:#fff;font-weight:700;font-size:10.5px;padding:1px 5px;border-radius:3px;min-width:34px;text-align:center}
.del{font-family:var(--mono);font-weight:600}.d0{color:var(--ok)}.d1{color:var(--wa)}.d2{color:var(--cr)}
button.b,a.b{background:#fff;border:1px solid #9fb1c5;color:#17375c;border-radius:3px;padding:4px 9px;font:600 12px system-ui;cursor:pointer;margin:1px 2px 1px 0;text-decoration:none;display:inline-block}
button.b:hover{background:#eef4fb}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover{background:#094c90}
button.w{border-color:#d9a85a;color:#7a4b00}button.r{border-color:#d58a85;color:#8e1f19}
button.s{padding:1px 6px;font-size:11px}

input,select,textarea{font:12.5px system-ui;padding:4px 6px;border:1px solid #b5c2d0;border-radius:3px;background:#fff;max-width:100%}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mu);margin:0 8px 8px 0}
label.f>*{color:var(--tx)}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px}

.al.cr{background:var(--crb);border-color:var(--cr)}.al.wa{background:var(--wab);border-color:var(--wa)}.al.in{background:var(--inb);border-color:var(--in)}.al.ok{background:var(--okb);border-color:var(--ok)}

.scroll{max-height:420px;overflow:auto}
.svgw{overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:4px}
svg text{font-family:system-ui,Arial,sans-serif}
.gantt{position:relative;height:18px;background:#f7f9fb;border:1px solid #e3e8ee}
.gantt .bk{position:absolute;top:1px;height:14px;border-radius:2px;color:#fff;font-size:9.5px;line-height:14px;overflow:hidden;white-space:nowrap;padding:0 2px;cursor:pointer}
.gantt .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:#d6001c}
.bar{height:10px;background:#dfe6ee;border-radius:2px;overflow:hidden}.bar>div{height:100%;background:var(--ac)}
.pill{display:inline-block;padding:0 6px;border-radius:8px;font-size:10.5px;background:#eef1f5;margin:1px}

.foot{font-size:11px;color:var(--mu);margin-top:8px}

[data-theme="leitstelle"]{--bg:#0d1824;--pan:#14222f;--hd:#06101a;--hd2:#12304f;--ac:#4ea3ff;--ac2:#18334d;--bd:#2a3d52;--tx:#dbe6f2;--mu:#8ea3b9;--okb:#123524;--wab:#3a2d10;--crb:#3d1a1a;--inb:#16304d;--grid:#22364b;--gridm:#3a5675}

[data-theme="leitstelle"] button.b,[data-theme="leitstelle"] a.b{background:#18293a;color:#cfe0f3;border-color:#3b5877}
[data-theme="leitstelle"] nav{background:#101d2a}[data-theme="leitstelle"] nav a{color:var(--tx)}[data-theme="leitstelle"] nav a:hover{background:#1a2c3d}
[data-theme="leitstelle"] #modal .mh{background:#1a2c3d}[data-theme="leitstelle"] .gantt{background:#0f1c28;border-color:#24384c}
[data-theme="leitstelle"] .chk{background:#0f1c28}[data-theme="leitstelle"] tr.rcr td{background:#2a1515}[data-theme="leitstelle"] tr.rwa td{background:#2a2312}
[data-theme="kontrast"]{--bg:#ffffff;--pan:#ffffff;--hd:#000000;--hd2:#222;--ac:#0033cc;--ac2:#e0e8ff;--bd:#000000;--tx:#000000;--mu:#222222;--grid:#999;--gridm:#333}
[data-theme="kontrast"] td{border-color:#666}[data-theme="kontrast"] .card,[data-theme="kontrast"] .kpi{border-width:2px}
[data-theme="sand"]{--bg:#efe9df;--pan:#fbf8f2;--hd:#3b3227;--hd2:#54473a;--ac:#8a5a2b;--ac2:#f1e4d2;--bd:#d8cdbd;--tx:#2d261e;--mu:#76695a;--grid:#e8dfd2;--gridm:#c8b8a2}
@media (max-width:900px){#app{grid-template-columns:150px 1fr}.g2,.g3,.g4{grid-template-columns:1fr}}
</style>

   ab Locarno) REKONSTRUIERT – keine offiziellen Fahrplanwerte.

const APP_VERSION = '4.0.0', SAVE_FORMAT = 'TILO-EVU-SIM', SAVE_VERSION = 2;

/* ===================== Regionen =====================
   Alle regionsabhängigen Stammdaten liegen in REGIONS[...]; applyRegion() lädt sie in die
   globalen (veränderlichen) Strukturen ST, SEGS, LINES, PAT ... Der Spielstand speichert S.region. */
const REGIONS = {};

const rev = p => p.trim().split(/\s+/).reverse().join(' ');
const clr = o => Object.keys(o).forEach(k => delete o[k]);
function applyRegion(id) {
  const R = REGIONS[id] || REGIONS.TILO;
  if (REG === R) return R;
  REG = R;
  [ST, SECT, SEGM, ADJ, LINES, PAT, LINE_STOPS, VTYPES, PARTNERS, BASEQ].forEach(clr);
  SEGS.length = 0; LINE_IDS.length = 0; BASES.length = 0; WORKSHOPS.length = 0;
  R.st.forEach(a => ST[a[0]] = { id:a[0], n:a[1], lat:a[2], lon:a[3], c:a[4], tr:a[5], pl:a[6], w:!!a[7], ab:!!a[8] });
  Object.assign(SECT, R.sect);
  R.segs.forEach(s => SEGS.push(s));
  SEGS.forEach(([a,b,m,km,c]) => {
    const inf = R.inf(a, b);
    const sg = { a, b, m, km, c, inf, k:skey(a,b) };
    SEGM[sg.k] = sg; (ADJ[a] = ADJ[a]||[]).push(b); (ADJ[b] = ADJ[b]||[]).push(a);
  });
  Object.assign(LINES, R.lines); R.lineIds.forEach(l => LINE_IDS.push(l));
  R.bases.forEach(b => BASES.push(b)); R.workshops.forEach(w => WORKSHOPS.push(w)); WORKSHOP = R.workshops[0]; ALB_ST = R.alb || null;
  Object.assign(BASEQ, R.baseq); Object.assign(VTYPES, R.vtypes); Object.assign(PARTNERS, R.partners);
  R.pat(PAT); if (R.lineStops) Object.assign(LINE_STOPS, R.lineStops());
  DISP_NAME = R.disp; EVU_NAME = R.evu; BZ_NAME = R.bz; RFI_NAME = R.rfi || R.bz;
  if (typeof regionUI === 'function') regionUI(R);
  return R;
}
const isWS = s => WORKSHOPS.includes(s);
/* nächstgelegene Werkstatt (Fahrzeit) */
function wsNear(s) { let b = WORKSHOPS[0], bd = 1e9; WORKSHOPS.forEach(w => { const p = netPath(s, w); if (!p) return; let d = 0; for (let i = 1; i < p.length; i++) d += segOf(p[i-1], p[i]).m; if (d < bd) { bd = d; b = w; } }); return b; }

    ch.forEach(u => { u._loc = es.s; u._ready = es.a; if (t.kind !== 'L') { u._line = t.line; u.line = t.line; } });
  }
  // Umlaufbezeichnungen
  let k = 1;
  units.filter(u => u._used).sort((a,b) => firstTripOf(a.id).stops[0].d - firstTripOf(b.id).stops[0].d).forEach(u => u.uml = 'U'+String(k++).padStart(2,'0'));
  function firstTripOf(id) { return ord.find(t => t.units.includes(id)); }
  // Nicht eingesetzte Fahrzeuge: Reserve / Abstellung
  const free = units.filter(u => !u._used);
  REG.freePos(free);
  units.forEach(u => { delete u._used; delete u._loc; delete u._ready; delete u._line; });
  return missing;
}

const PREP = 10, CLOSE = 10;

function crewRange(t) {
  if (t.ops && t.ops.from <= t.a0) return null;
  let f = t.a0, e = t.a1;
  if (t.ops) e = Math.min(e, t.ops.from);
  if (t.wing && t.wing.role === 'carried' && !t.wing.off) { if (t.wing.kind === 'split') f = Math.max(f, t.wing.at); else e = Math.min(e, t.wing.at); }
  return e > f ? [f, e] : null;
}
function unitRange(t) {
  if (t.ops && t.ops.from <= t.a0) return null;
  let e = t.a1; if (t.ops) e = Math.min(e, t.ops.from);
  return e > t.a0 ? [t.a0, e] : null;
}
function sectionsOf(t, f, e) { const s = new Set(); for (let i = f; i < e; i++) { const sg = segOf(t.stops[i].s, t.stops[i+1].s); if (sg) s.add(sg.c); } return s; }

function findRide(T, from, to, opt) {
  // opt.needBy: späteste Ankunft (letzte passende) | opt.after: früheste Abfahrt (erste passende)
  let best = null;
  for (const t of T) {
    if (t.st === 'canc' || t.kind === 'L' || t.kind === 'U' || t.kind === 'SCH') continue;
    const i = t.stops.findIndex((x,k) => k >= t.a0 && k <= t.a1 && x.s === from && x.h);
    if (i < 0) continue;
    const j = t.stops.findIndex((x,k) => k > i && k <= t.a1 && x.s === to && x.h);
    if (j < 0) continue;
    const d = t.stops[i].d, a = t.stops[j].a;
    if (opt.needBy != null) { if (a <= opt.needBy && a >= opt.needBy - 90 && (!best || a > best.a)) best = { t, i, j, d, a }; }
    else if (d >= opt.after && d <= opt.after + 90 && (!best || a < best.a)) best = { t, i, j, d, a };
  }
  return best;
}

function buildDuties(T, rng) {
  const D = [];
  const list = [];
  T.forEach(t => { const cr = crewRange(t); if (!cr) return;
    const sp = REG.crewSplit;
    if (!sp || t.stops[cr[1]].a - t.stops[cr[0]].d <= sp + 20) { list.push({ t, cr }); return; }
    // lange Fernverkehrsleistungen: Lokführerwechsel an Depotbahnhöfen
    let f = cr[0];
    while (f < cr[1]) {
      let k = -1;
      for (let j = f + 1; j < cr[1]; j++) if (BASES.includes(t.stops[j].s) && t.stops[j].h && t.stops[j].a - t.stops[f].d <= sp) k = j;
      if (k < 0 || t.stops[cr[1]].a - t.stops[f].d <= sp + 20) k = cr[1];
      list.push({ t, cr: [f, k] }); f = k;
    }
  });
  list.sort((a,b) => a.t.stops[a.cr[0]].d - b.t.stops[b.cr[0]].d);
  for (const { t, cr } of list) {
    const s0 = t.stops[cr[0]].s, t0 = t.stops[cr[0]].d, s1 = t.stops[cr[1]].s, t1 = t.stops[cr[1]].a;
    const secs = [...sectionsOf(t, cr[0], cr[1])];
    const cls = [...new Set(t.units.filter(u => S.veh[u]).map(u => VTYPES[S.veh[u].type].cls))];
    let best = null, bs = 1e9;
    for (const d of D) {
      if (d.loc !== s0) continue;
      const same = d.lastUnits.some(u => t.units.includes(u));
      const gap = t0 - d.free;
      if (gap < (same ? 3 : 7) || gap > 140) continue;
      if (!secs.every(c => BASEQ[d.base].includes(c)) || !cls.every(c => REG.baseVeh(d.base).includes(c))) continue;
      if (t1 + roadMin(s1, d.base) + CLOSE - d.start > 570) continue;
      const brk = d.brk || gap >= 30;
      if (t1 - d.start > 330 && !brk) continue;
      let sc = gap - (same ? 25 : 0) - ((gap >= 30 && !d.brk && t0 - d.start > 170) ? 30 : 0);
      if (sc < bs) { bs = sc; best = d; }
    }
    if (!best) {
      const cands = BASES.filter(b => secs.every(c => BASEQ[b].includes(c)) && cls.every(c => REG.baseVeh(b).includes(c))).sort((a,b) => roadMin(a,s0) - roadMin(b,s0));
      const SH = REG.share;
      const near = cands.filter(b => roadMin(b,s0) <= roadMin(cands[0],s0) + 26);
      const cnt = b => D.filter(x => x.base === b).length / SH[b];
      const base = near.sort((a,b) => cnt(a) - cnt(b))[0] || cands[0] || BASES[0];
      best = { base, start:0, loc:s0, free:t0, trips:[], brk:false, lastUnits:[], xf:[] };
      const needBy = t0 - PREP;
      if (s0 !== base) {
        const r = findRide(T, base, s0, { needBy });
        if (r) { best.xf.push({ mode:'Zug', ride:r.t.id, from:base, to:s0, start:r.d, end:r.a }); best.start = r.d - PREP; }
        else { const m = roadMin(base, s0); best.xf.push({ mode:'Taxi', from:base, to:s0, start:needBy - m, end:needBy, dur:m }); best.start = needBy - m - PREP; }
      } else best.start = t0 - PREP;
      D.push(best);
    } else if (t0 - best.free >= 30) best.brk = true;
    best.trips.push(t); (best.pieces = best.pieces || []).push({ t, f: cr[0], e: cr[1] }); best.loc = s1; best.free = t1; best.lastUnits = t.units.slice();
  }
  D.forEach(d => {
    if (d.loc !== d.base) {
      const r = findRide(T, d.loc, d.base, { after: d.free + 5 });
      if (r && r.a - d.free < 100) { d.xf.push({ mode:'Zug', ride:r.t.id, from:d.loc, to:d.base, start:r.d, end:r.a }); d.end = r.a + CLOSE; }
      else { const m = roadMin(d.loc, d.base); d.xf.push({ mode:'Taxi', from:d.loc, to:d.base, start:d.free + 5, end:d.free + 5 + m, dur:m }); d.end = d.free + 5 + m + CLOSE; }
    } else d.end = d.free + CLOSE;
  });
  return D;
}

function genDrivers(T, rng) {
  const D = buildDuties(T, rng), DR = {}, R = REG.drv;
  const names = [];
  R.first.forEach(f => R.last.forEach(l => names.push([f,l])));
  for (let i = names.length-1; i > 0; i--) { const j = Math.floor(rng()*(i+1)); [names[i],names[j]] = [names[j],names[i]]; }
  let k = 0, pn = 4100;
  const mkQ = (base, need) => {
    const q = new Set([...R.always, ...need]);
    const p = R.prob[base] || {};
    Object.keys(p).forEach(c => { if (rng() < p[c]) q.add(c); });
    (R.must || []).forEach(c => q.add(c));
    (R.ban[base] || []).forEach(c => q.delete(c));   // z. B. Chiasso-Lokführer nicht Luino-kundig
    return [...q].filter(c => BASEQ[base].includes(c) || need.includes(c)).sort();
  };
  const mk = (base, start, end, res, need, vehs) => {
    const [fn, ln] = names[k++ % names.length];
    const id = 'L' + (pn++);
    DR[id] = { id, pnr: R.pnr + (pn+3000), fn, ln, base, start, end, res, quals: mkQ(base, need), veh: vehs || REG.baseVeh(base).slice(),
      max:600, loc:base, sick:false, xf:[], busy:null, ext:0, note:'' };
    return DR[id];
  };
  let xid = 1;
  D.forEach(d => {
    const need = new Set(); d.pieces.forEach(p => sectionsOf(p.t, p.f, p.e).forEach(c => need.add(c)));
    const dr = mk(d.base, d.start, d.end, false, [...need]);
    d.pieces.forEach(p => { if (p.f === crewRange(p.t)[0]) p.t.drv = dr.id; else { p.t.dc = (p.t.dc || []).filter(c => c.at !== p.f); p.t.dc.push({ at: p.f, drv: dr.id }); p.t.dc.sort((a, b) => a.at - b.at); } });
    dr.xf = d.xf.map(x => ({ id:'X'+(xid++), ...x, st:'plan' }));
    if (R.vehRestrict) R.vehRestrict(dr, d, rng);
  });
  // Reserve-Lokführer mit regulären Dienstzeiten
  R.reserves.forEach((r, i) => {
    const d = mk(r[0], r[1], r[2], true, r[3], r[4]);
    d.quals = [...new Set([...R.always, ...(R.must || []), ...r[3]])].filter(c => !(R.ban[r[0]] || []).includes(c)).sort();
    d.note = 'Personalreserve ' + ST[r[0]].n;
  });
  return DR;
}

function ciIssues(m) {

    const ok = S.bus.svc.some(s => (s.st === 'bestätigt' || s.st === 'aktiv') && (!m.from || [s.from, s.to].includes(m.from) || [s.from, s.to].includes(m.to)));

/* ---------- Konflikterkennung (Planung) ---------- */
function scanConflicts(h) {
  const t = now(), out = [];
  for (const tr of S.trips) {
    if (tr.st === 'done' || tr.st === 'canc') continue;
    const st0 = tr.stops[tr.a0].d;
    if (tr.st === 'plan' && st0 > t + h) continue;
    if (tr.cf) { out.push({ tr, lvl: 'cr', txt: tr.cf }); continue; }
    if (tr.st !== 'plan') { if (tr.hold) out.push({ tr, lvl: 'cr', txt: 'steht: ' + tr.hold }); continue; }
    if (tr.bz === 'pend') { out.push({ tr, lvl: 'wa', txt: 'BZ-Genehmigung ausstehend' }); continue; }
    if (tr.bz === 'rej') { out.push({ tr, lvl: 'cr', txt: 'Trasse abgelehnt' }); continue; }
    if (!isTILO(tr)) continue;
    if (tr.bz === 'frei') out.push({ tr, lvl: 'wa', txt: 'BZ-Freigabe liegt vor – Massnahme noch umsetzen' });
    if (tr.wing && tr.wing.role === 'carried' && tr.wing.kind === 'split' && !tr.wing.off) { if (!crewAt(tr, tr.wing.at)) out.push({ tr, lvl: 'cr', txt: 'kein Lokführer für Zugteil ab ' + sn(tr.stops[tr.wing.at].s) }); continue; }
    uSegs(tr).forEach((sg, k) => {
      const where = k ? ' ab ' + sn(tr.stops[sg.f].s) : '';
      if (!sg.units.length) out.push({ tr, lvl: 'cr', txt: 'kein Fahrzeug zugewiesen' + where });
      const prevU = k ? uSegs(tr)[k - 1].units : [];
      sg.units.forEach(u => {
        const v = VH(u); if (!v) return;
        if (v.st === 'defekt' || v.st === 'reparatur' || v.st === 'werkstatt') out.push({ tr, lvl: 'cr', txt: v.nr + ' ' + vState(v) + where });
        if (prevU.includes(u)) return;
        const pl = unitLocBefore(u, estArr(tr, sg.f), tr);

    const pun = done.filter(t => t.dl < 3).length;
    const canc = L.filter(t => t.st === 'canc').length, part = L.filter(t => t.st !== 'canc' && (t.a1 < t.stops.length - 1 || t.a0 > 0) && !t.nextNr).length;
    const avg = done.length ? done.reduce((a, t) => a + Math.max(0, t.dl), 0) / done.length : 0;
    const pax = L.filter(t => t.st === 'canc' || ((t.a1 < t.stops.length - 1 || t.a0 > 0) && !t.nextNr)).reduce((a, t) => a + t.dem, 0);

  });
  const tot = rows.reduce((a, r) => ({ n: a.n + r.n, done: a.done + r.done, pun: a.pun + r.pun, canc: a.canc + r.canc, part: a.part + r.part, pax: a.pax + r.pax }), { n: 0, done: 0, pun: 0, canc: 0, part: 0, pax: 0 });

  h += '<div class="card"><table><tr><th>Linie</th><th>geplant</th><th>gefahren</th><th>Pünktlichkeit</th><th style="width:30%"></th><th>Ø Verspätung</th><th>Ausfälle</th><th>Teilausfälle</th><th>betroffene Fahrgäste</th></tr>' + rows.map(r => '<tr><td>' + lb(r.l) + '</td><td>' + r.n + '</td><td>' + r.done + '</td><td class="mono">' + (r.done ? (r.pun / r.done * 100).toFixed(1) + ' %' : '–') + '</td><td><div class="bar"><div style="width:' + (r.done ? r.pun / r.done * 100 : 0) + '%;background:' + LINES[r.l].c + '"></div></div></td><td class="mono">' + r.avg.toFixed(1) + ' min</td><td>' + r.canc + '</td><td>' + r.part + '</td><td>' + r.pax + '</td></tr>').join('') + '</table></div>';
  const ot = Object.values(S.drv).filter(d => d.ext > 0).sort((a, b) => b.ext - a.ext);
  const km = Object.values(S.veh).reduce((a, v) => a + v.km, 0);

  const sel = K.items.filter(i => i.sel && !i.done);
  const ul = [], sum = {}, ulBy = {};
  sel.forEach(it => {
    const p = it.p, tr = p.trip ? TR(p.trip) : null;
    try {
      if (it.k === 'kurz') { const ok = shortStart(tr, +p.idx, 'Störungskonzept'); it.res = ok ? 'ausgeführt' : 'nicht möglich'; }
      else if (it.k === 'ausfall' && p.from != null) { cancelTrip(tr, +p.from, 'Störungskonzept'); it.res = 'Teilausfall ab ' + sn(tr.stops[p.from].s); }
      else if (it.k === 'ausfall') { if (p.start != null && tr.st === 'plan') { tr.a0 = p.start; tr.fl.teilausfall = 'Störungskonzept'; RT.dirty = true; log('Fahrplan', tname(tr) + ' beginnt erst in ' + sn(tr.stops[p.start].s) + ' (Störungskonzept)', tr.id); } else cancelTrip(tr, null, 'Störungskonzept ' + KONZ[K.key].n); it.res = 'ausgeführt'; }
      else if (it.k === 'wende') { const nx = consistAt(tr, tr.a0).length ? nextTripOfUnit(consistAt(tr, tr.a0)[0], tr.stops[tr.a1].a) : null; const st = tr.stops[+p.idx].s; bzRequest('wende', { trip: tr.id, idx: +p.idx, gegen: nx && nx.stops.some((s, k) => s.s === st && k > nx.a0 && k < nx.a1) ? nx.id : null }, 'Vorzeitige Wende ' + tname(tr) + ' in ' + sn(st) + ' (Konzept)'); it.res = 'Anfrage an BZ'; }
      else if (it.k === 'brechen') { bzRequest('brechen', { st: p.st, pairs: p.pairs }, 'Gebrochener Betrieb ' + p.line + ' in ' + sn(p.st) + ' (' + p.pairs.length + ' Tausch)'); it.res = 'Anfrage an BZ'; }
      else if (it.k === 'uebernahme') { const u = TR(p.target); bzRequest('wende', { trip: tr.id, idx: +p.idx, auf: { target: p.target, uidx: u.stops.findIndex((s, j) => j >= u.a0 && j < u.a1 && s.s === tr.stops[+p.idx].s) } }, 'Wende ' + tname(tr) + ' in ' + sn(tr.stops[+p.idx].s) + ' auf ' + tname(u)); it.res = 'Anfrage an BZ'; }
      else if (it.k === 'umleitung') { (ulBy[p.seg || ''] = ulBy[p.seg || ''] || []).push(...p.trips); ul.push(...p.trips); it.res = 'Anfrage an BZ'; }
      else if (it.k === 'shift') { fpChange(tr, x => { for (let k = p.idx; k < x.stops.length; k++) { if (k > p.idx) x.stops[k].a += p.min; x.stops[k].d += p.min; } }, 'Kreuzungszuschlag +' + p.min + ' min (Konzept)'); it.res = 'Anfrage an BZ'; }
      else if (it.k === 'ersatz') { busRequest(p.co, p.from, p.to, p.start, +p.n, 'Störungskonzept'); it.res = 'Busanfrage gesendet'; }
      else if (it.k === 'ki') { ciDraftAuto(p.typ, Object.assign({ start: now() }, p)); it.res = 'Entwurf in Kundeninformation'; }
      else if (it.k === 'lf') { const r = assignDriver(tr, DV(p.drv), 'Störungskonzept', p.sec); it.res = r.ok ? 'zugewiesen' : 'nicht möglich: ' + r.E[0]; }
      else if (it.k === 'partner') { partnerRequest(p.partner, tr.id, Math.max(tr.a0, p.idx || tr.a0), 'Störungskonzept'); it.res = 'Anfrage gesendet'; }
      else if (it.k === 'fztausch') { const n = swapUnitsFrom(p.a, p.b, p.from); unitHist(VH(p.a), 'Umlauftausch mit ' + VH(p.b).nr + ' (Konzept)'); unitHist(VH(p.b), 'Umlauftausch mit ' + VH(p.a).nr + ' (Konzept)'); log('Fahrzeug', 'Umlauftausch ' + VH(p.a).nr + ' ↔ ' + VH(p.b).nr + ' (' + n + ' Leistungen, Störungskonzept)'); it.res = n + ' Leistungen getauscht'; }
      else if (it.k === 'leer') { const v = VH(p.veh); const lt = createTrip({ kind: 'L', line: 'LEER', from: v.loc, to: p.to, dep: p.dep, units: [v.id] }); const C = Object.values(S.drv).map(d => ({ d, r: checkDriver(d, lt) })).filter(o => o.r.ok).sort((a, b) => b.d.res - a.d.res); if (C.length) lt.drv = C[0].d.id; addTrip(lt); bzRequest('leer', { tripId: lt.id, from: v.loc, to: p.to, dep: p.dep, units: [v.id] }, 'Leerfahrt ' + lt.nr + ' (Konzept)'); swapUnitsFrom(p.a, v.id, p.from); it.res = 'Leerfahrt ' + lt.nr + ' beantragt' + (C.length ? '' : ' – Lokführer fehlt!'); }
      else if (it.k === 'dtrem') { tr.units = tr.units.filter(u => u !== p.veh); RT.dirty = true; unitHist(VH(p.veh), 'aus Doppeltraktion ' + tname(tr) + ' gelöst (Konzept)'); log('Fahrzeug', p.veh + ' aus ' + tname(tr) + ' entfernt (Fahrzeugmangel)', tr.id); it.res = 'ausgeführt'; }
      else { it.res = 'zur Kenntnis'; }
      it.done = true; sum[it.k] = (sum[it.k] || 0) + 1;
    } catch (e) { it.res = 'Fehler: ' + e.message; }
  });
  Object.keys(ulBy).forEach(sg => bzRequest('umleitung', sg ? { trips: ulBy[sg], seg: sg } : { trips: ulBy[sg] }, 'Umleitung ' + (sg ? sg.split('|').map(sn).join('–') : 'Bergstrecke') + ' (' + ulBy[sg].length + ' Züge, Konzept)'));
  S.concepts.push({ t: now(), key: K.key, n: KONZ[K.key].n + ' – ' + K.title, n_sel: sel.length, n_all: K.items.length, sum: Object.keys(sum).map(k => sum[k] + '× ' + (KZ_KIND[k] || k)).join(', ') });
  log('Sondermassnahme', 'Störungskonzept „' + KONZ[K.key].n + '“ (' + K.title + '): ' + sel.length + ' von ' + K.items.length + ' Massnahmen veranlasst');
  uiNotify(sel.length + ' Massnahmen veranlasst – BZ-Antworten beachten', 'info');
  refresh(true);
  return sel.length;
}

/* Regeln → Zugmassnahmen */
function kzGenerate(fromT, toT) {
  const E = RT.ui.kedit, t0 = fromT != null ? fromT : (E.from != null ? E.from : now()), t1 = toT != null ? toT : (E.to != null ? E.to : now() + 180);
  if (!RT.ui.konz) RT.ui.konz = { key: 'manuell', title: 'Linienschema', t: now(), items: [] };
  const I = RT.ui.konz.items, id = () => 'm' + I.length + '_' + Math.round(Math.random() * 1e5);

  const ul = [];

    const St = kzStations(q.line);
    const L = S.trips.filter(x => x.line === q.line && (x.kind === 'R' || x.kind === 'V') && (x.st === 'plan' || x.st === 'run') && !(x.wing && x.wing.role === 'carried' && !x.wing.off && x.st === 'run') && tStart(x) <= t1 && tEnd(x) >= t0);

      const towardB = x.dir === 'S';  // links → rechts im Schema
      const lbl = tname(x) + ' (' + fmt(tStart(x)) + ' ' + sn(x.stops[x.a0].s) + ' → ' + sn(x.stops[x.a1].s) + ')';
      const endAt = (k, why) => { if (k <= cur) { if (!have('ausfall', x.id)) I.push({ id: id(), k: 'ausfall', label: lbl + ' fällt aus', p: { trip: x.id }, sel: true, note: why }); return; } if (k >= x.a1 || have('wende', x.id)) return; const opts = x.stops.map((s, j) => j > cur && j < x.a1 && s.h && ST[s.s].w ? [j, sn(s.s)] : null).filter(Boolean); if (!ST[x.stops[k].s].w && opts.length) { const prev = opts.filter(o => o[0] <= k).pop() || opts[0]; k = prev[0]; } I.push({ id: id(), k: 'wende', label: lbl + ' wendet in ' + sn(x.stops[k].s), p: { trip: x.id, idx: k }, ed: opts.length ? [{ key: 'idx', type: 'sel', opts, l: '' }] : null, sel: true, note: why }); };
      const startAt = (k, why) => { if (x.st !== 'plan' || k <= x.a0 || have('kurz', x.id)) return; if (k >= x.a1) { if (!have('ausfall', x.id)) I.push({ id: id(), k: 'ausfall', label: lbl + ' fällt aus', p: { trip: x.id }, sel: true, note: why }); return; } I.push({ id: id(), k: 'kurz', label: lbl + ' beginnt erst in ' + sn(x.stops[k].s), p: { trip: x.id, idx: k }, sel: true, note: why + ' – Fahrzeug/Personal müssen dort bereitstehen' }); };
      const k = pos(q.st);
      if (q.type === 'linie') { if (!have('ausfall', x.id)) I.push({ id: id(), k: 'ausfall', label: lbl + ' fällt aus', p: { trip: x.id }, sel: true, note: kzRuleText(q) }); }
      if (q.type === 'wende' && k >= 0) {
        // keep A = Abschnitt links von X bleibt
        if ((q.keep === 'A') === towardB) endAt(k, kzRuleText(q)); else startAt(k, kzRuleText(q));
      }
      if (q.type === 'wende' && k < 0) {
        const xi = St.indexOf(q.st), firstIdx = St.indexOf(x.stops[x.a0].s);
        if ((q.keep === 'A' && firstIdx > xi) || (q.keep === 'B' && firstIdx < xi && St.indexOf(x.stops[x.a1].s) < xi)) if (!have('ausfall', x.id)) I.push({ id: id(), k: 'ausfall', label: lbl + ' fällt aus (ausserhalb des Abschnitts)', p: { trip: x.id }, sel: true, note: kzRuleText(q) });
      }
      if (q.type === 'ausfall' && k >= 0 && (q.dir === x.dir)) { if (k <= x.a0) { if (!have('ausfall', x.id)) I.push({ id: id(), k: 'ausfall', label: lbl + ' fällt aus', p: { trip: x.id }, sel: true, note: kzRuleText(q) }); } else if (k > cur && k < x.a1) I.push({ id: id(), k: 'ausfall', label: lbl + ': Ausfall ab ' + sn(q.st), p: { trip: x.id, from: k }, sel: true, note: ST[q.st].w ? '' : sn(q.st) + ' ist kein Wendebahnhof – Fahrzeug bleibt dort stehen' }); }
      if (q.type === 'nur') {

/* ---------- Gebrochener Betrieb: Fahrzeug- und Personaltausch zweier Gegenzüge an einem Bahnhof ---------- */
function swapAtStation(A, B, st) {
  const ia = A.stops.findIndex((s, k) => k > A.a0 && k < A.a1 && s.s === st), ib = B.stops.findIndex((s, k) => k > B.a0 && k < B.a1 && s.s === st);
  if (ia < 0 || ib < 0) return false;
  if ((A.st === 'run' && A.i >= ia) || (B.st === 'run' && B.i >= ib)) return false;
  const uA = consistAt(A, ia - 1).slice(), uB = consistAt(B, ib - 1).slice(), dA = crewAt(A, ia - 1), dB = crewAt(B, ib - 1);
  const setU = (t, k, units) => { t.uc = (t.uc || []).filter(c => c.at !== k); t.uc.push({ at: k, units }); t.uc.sort((a, b) => a.at - b.at); };
  const setD = (t, k, drv) => { t.dc = (t.dc || []).filter(c => c.at !== k); t.dc.push({ at: k, drv }); t.dc.sort((a, b) => a.at - b.at); };
  setU(A, ia, uB); setU(B, ib, uA);
  if (dA && dB) { setD(A, ia, dB); setD(B, ib, dA); }
  [A, B].forEach(t => { const s = t.stops[t === A ? ia : ib]; s.h = true; t.fl.gebrochen = st; });
  uA.forEach(u => VH(u) && unitHist(VH(u), 'gebrochener Betrieb ' + sn(st) + ': übernimmt ' + tname(B)));
  uB.forEach(u => VH(u) && unitHist(VH(u), 'gebrochener Betrieb ' + sn(st) + ': übernimmt ' + tname(A)));
  RT.dirty = true;
  log('Sondermassnahme', 'Gebrochener Betrieb in ' + sn(st) + ': ' + tname(A) + ' ↔ ' + tname(B) + ' tauschen Fahrzeug' + (dA && dB ? ' und Lokführer' : '') + ' (Fahrgäste steigen um)', A.id);
  return true;
}

    + '<table style="margin-top:8px"><tr><td>pünktliche Ankünfte</td><td class="mono">' + k.ok + '</td></tr><tr><td>verspätete Ankünfte (≥ 3 min)</td><td class="mono">' + k.late + '</td></tr><tr><td>Ausfälle</td><td class="mono">' + k.canc + '</td></tr><tr><td>überfüllte Züge</td><td class="mono">' + k.crowd + '</td></tr><tr><td>Schichtziele erreicht / verfehlt</td><td class="mono">' + g.mOk + ' / ' + g.mFail + '</td></tr><tr><td>beste Pünktlichkeitsserie</td><td class="mono">' + g.bestStreak + '</td></tr><tr><td>Ereignisse</td><td class="mono">' + S.inc.length + '</td></tr></table>'
    + '<div style="margin-top:6px">' + (g.badges.map(b => '<span class="pill on">🏅 ' + esc(b.n) + '</span>').join(' ') || '<span class="mu">noch keine Auszeichnungen</span>') + '</div>'
    + '<h3>Bestenliste ' + esc(REG.short) + '</h3><table><tr><th>#</th><th>Punkte</th><th>Note</th><th>Pünktlich</th><th>Datum</th></tr>' + (T.map((x, i) => '<tr><td>' + (i + 1) + '</td><td class="mono">' + x.s + '</td><td>' + x.g + '</td><td class="mono">' + x.p + ' %</td><td class="sm">' + esc(x.d) + ' (Tag ' + x.day + ')</td></tr>').join('') || '<tr><td colspan="5" class="mu">Bestenliste füllt sich am Ende eines Betriebstags.</td></tr>') + '</table>'
    + '<div style="margin-top:8px"><button class="b p" onclick="closeModalSilent();newDay();showMod(\'dash\');header()">Nächste Schicht (schwieriger)</button><button class="b" onclick="closeModal()">weiterspielen</button></div>');
}
(function () {
  const nd0 = newDay;
  newDay = function () { const g = S.game; nd0(); if (g) { S.game = null; const n = G(); n.badges = g.badges; n.total = (g.total || 0) + g.score; } };
  const ei = MOD.einst.init;
  MOD.einst.init = () => '<div class="card"><h2 style="margin-top:0">Spielmodus</h2><div class="row"><label class="f">Spielmodus (Punkte, Schichtziele, Lagephasen)<select onchange="S.cfg.game=this.value===\'1\';header();refresh(true)"><option value="1"' + (S.cfg.game ? ' selected' : '') + '>ein</option><option value="0"' + (!S.cfg.game ? ' selected' : '') + '>aus (reine Simulation)</option></select></label><label class="f">Automatische Umlauf-Rückführung<select onchange="S.cfg.autoRepair=this.value===\'1\'"><option value="1"' + (S.cfg.autoRepair ? ' selected' : '') + '>ein (alle 10 min, max. 3 h voraus)</option><option value="0"' + (!S.cfg.autoRepair ? ' selected' : '') + '>aus</option></select></label><label class="f">Signalton bei Ereignissen<select onchange="S.cfg.sound=this.value===\'1\'"><option value="1"' + (S.cfg.sound ? ' selected' : '') + '>ein</option><option value="0"' + (!S.cfg.sound ? ' selected' : '') + '>aus</option></select></label></div><div class="sm mu">Die Ereignisdichte (unten) steuert die Grundrate; die Lagephasen wechseln zwischen ruhig, normal, angespannt und Krise (mit Themen wie Unwetterfront, Hitzewelle, Grossanlass). Jede weitere Schicht wird etwas anspruchsvoller.</div></div>' + ei();
  const mu = MOD.uml.init;
  if (mu) MOD.uml.init = () => '<div class="row" style="margin-bottom:6px"><button class="b p" onclick="uiRepair()">↺ Umläufe automatisch zurückführen</button><span class="sm mu">Tauscht Fahrzeuge, die nach Störungen auf fremden Linien oder am falschen Ort stehen, wieder in ihre eigenen Umläufe (nur Fahrzeuge am selben Bahnhof).</span></div>' + mu();
})();
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', () => { const sp = document.querySelector('header .sp'); if (sp && !document.getElementById('gmw')) { const d = document.createElement('div'); d.id = 'gmw'; d.style.cssText = 'display:flex;gap:6px;align-items:center;margin-left:8px;white-space:nowrap;font-size:12px'; sp.parentNode.insertBefore(d, sp); } });

/* =================== Funktionstests Version 5 =================== */
function runTestsV5(T, A, fresh, until) {
  ['THB', 'SOB', 'RHB', 'FV', 'LIG', 'SIC'].forEach(r => T('V5: Region ' + REGIONS[r].name + ' – Fahrplan, Umläufe, Dienste, 3 h störungsfrei', () => {
    fresh(300, r); S.cfg.autoRepair = false;
    A(REG.id === r && S.trips.length > 150, 'zu wenige Fahrten');
    const noU = S.trips.filter(x => !x.units.length), noD = S.trips.filter(x => crewRange(x) && !x.drv);
    A(!noU.length, noU.length + ' Fahrten ohne Fahrzeug (' + noU.slice(0, 3).map(x => x.nr).join(',') + ')'); A(!noD.length, noD.length + ' Fahrten ohne Lokführer');
    A(LINE_IDS.every(l => l === 'EXT' || S.trips.some(x => x.line === l)), 'Linie ohne Fahrten');
    simAdvance(180);
    const D = S.trips.filter(x => x.st === 'done' && x.kind === 'R'), P = D.filter(x => x.dl < 3);
    A(D.length > 12 && P.length / D.length > 0.95, 'Pünktlichkeit ' + (P.length / Math.max(1, D.length) * 100).toFixed(1) + ' %');
    return LINE_IDS.length + ' Linien, ' + S.trips.length + ' Fahrten, ' + Object.keys(S.veh).length + ' Fahrzeuge, ' + Object.keys(S.drv).length + ' Lokführer; bis 08:00 ' + D.length + ' Fahrten, ' + (P.length / D.length * 100).toFixed(1) + ' % pünktlich';
  }));
  T('V5: ZVV-Fahrwege Löwenstrasse / Halle / Museumstrasse, Zugnummern, S3 HVZ Bülach, S24 Thayngen, S33', () => {
    fresh(300, 'ZVV');
    const via = (l, a, b) => S.trips.filter(x => x.line === l).every(x => x.stops.some((s, i) => i < x.stops.length - 1 && skey(s.s, x.stops[i + 1].s) === skey(a, b)));
    A(via('S8', 'OER', 'ZUL') && via('S2', 'OER', 'ZUL') && via('S14', 'ZUL', 'OER'), 'Weinbergtunnel (Löwenstrasse) nicht befahren');
    A(via('S6', 'HAR', 'ZUM') && via('S7', 'ZUM', 'STA') && via('S16', 'OER', 'HAR'), 'Museumstrasse – Hardbrücke – Oerlikon nicht befahren');
    A(via('S24', 'WIP', 'ZUE') && via('S21', 'ZUE', 'WIP'), 'Halle – Wipkingen nicht befahren');
    const nr = { S2: 182, S3: 183, S8: 188, S11: 191, S21: 201, S33: 203, S42: 190 }; Object.keys(nr).forEach(l => A(S.trips.filter(x => x.line === l).every(x => Math.floor(x.nr / 100) === nr[l]), 'Zugnummern ' + l));
    A(!LINE_IDS.includes('S22'), 'S22 vorhanden');
    const s3 = S.trips.filter(x => x.line === 'S3'); A(s3.some(x => x.stops.some(s => s.s === 'BUE')) && s3.filter(x => x.stops.some(s => s.s === 'BUE')).every(x => [5, 6, 7, 8, 9, 15, 16, 17, 18, 19].includes(Math.floor(x.stops[0].d / 60))), 'S3 Bülach nicht nur in der HVZ');
    A(S.trips.some(x => x.line === 'S24' && x.stops[0].s === 'THA'), 'S24 Thayngen fehlt');
    return 'S8 18801 ' + RT.NR[18801].stops.map(s => s.s).slice(4, 8).join('–') + ', S6 via Hardbrücke–Museumstrasse, S24 via Wipkingen–Halle, S3 HVZ bis Bülach, S33 2030x';
  });
  T('V5: Fahrzeugtauglichkeit Stromsystem (RhB Bernina 1000 V DC, Diesel-Strecken)', () => {
    fresh(300, 'RHB');
    const b = S.trips.find(x => x.line === 'BER'), cap = Object.values(S.veh).find(v => v.type === 'CAP');
    A(b.units.every(u => VTYPES[VH(u).type].sys.includes('DC')), 'Bernina-Umlauf mit AC-Fahrzeug');
    A(checkUnits([cap.id], b).E.some(e => /Gleichstrom/.test(e)), 'Capricorn auf Bernina nicht verhindert');
    fresh(300, 'LIG');
    const r7 = S.trips.find(x => x.line === 'R7'), rock = Object.values(S.veh).find(v => v.type === 'ROC');
    A(checkUnits([rock.id], r7).E.some(e => /nicht elektrifiziert/.test(e)), 'Elektrotriebzug auf Dieselstrecke nicht verhindert');
    return 'Capricorn auf Berninalinie und Rock auf der Valle Stura werden abgewiesen';
  });
  T('V5: Fernverkehr – Lokführerwechsel auf langen Läufen', () => {
    fresh(300, 'FV');
    const ic = S.trips.filter(x => x.line === 'IC1'); A(ic.every(x => (x.dc || []).length >= 1), 'IC1 ohne Lokführerwechsel');
    const x = ic.sort((a, b) => a.stops[0].d - b.stops[0].d)[0]; const segs = cSegs(x);
    return tname(x) + ': ' + segs.map(g => sn(x.stops[g.f].s) + '→' + sn(x.stops[g.e].s)).join(', ');
  });
  T('V5: Umlauf-Rückführung bringt linienfremde Fahrzeuge zurück', () => {
    fresh(330, 'ZVV'); S.cfg.autoRepair = false;
    // Zwei Fahrzeuge verschiedener Linien am selben Bahnhof vertauschen (Störungsfolge simulieren)
    let pair = null;
    for (const x of S.trips.filter(y => y.st === 'plan' && y.kind === 'R' && tStart(y) > now() + 30 && tStart(y) < now() + 150)) {
      const u = x.units[0], org = x.stops[x.a0].s;
      const y = S.trips.find(z => z !== x && z.st === 'plan' && z.kind === 'R' && z.line !== x.line && z.stops[z.a0].s === org && Math.abs(tStart(z) - tStart(x)) < 30 && z.units.length === 1 && compat(VH(z.units[0]), VH(u)) && VH(z.units[0]).type === VH(u).type);
      if (y) { pair = [x, y]; break; }
    }
    A(pair, 'kein Tauschpaar gefunden');
    const [x, y] = pair, a = x.units[0], b = y.units[0], from = Math.min(tStart(x), tStart(y)) - 0.1;
    swapUnitsFrom(a, b, from);
    const m0 = umlMisplaced().length; A(m0 >= 1, 'Störung nicht nachgestellt');
    const r = umlRepair(240, true);
    A(r.n >= 1 && umlMisplaced().length < m0, 'Rückführung wirkungslos');
    return 'linienfremd vorher ' + m0 + ', Tausche ' + r.n + ', nachher ' + umlMisplaced().length;
  });
  T('V5: Spielmodus – alle Ereignisarten, Entscheid unter Zeitdruck, Punkte, Ziele', () => {
    fresh(400, 'ZVV'); S.cfg.autoRepair = false;
    const K = Object.keys(GEVF), bad = [];
    K.forEach(k => { try { fireEvent(k); } catch (e) { bad.push(k + ': ' + e.message); } });
    A(!bad.length, bad.join('; '));
    const med = S.inc.find(i => i.type === 'medizin' && i.st === 'offen');
    if (med) { const s0 = G().score; simAdvance(8); A(med.st === 'erledigt' && med.auto, 'Standardentscheid nach Fristablauf fehlt'); A(G().score < s0 + 1000, 'Punkte'); }
    S.cfg.density = 'normal'; simAdvance(120);
    const g = G(); A(g.hist.length > 10 && g.missions.length >= 1, 'keine Punkte / Ziele');
    return K.length + ' Ereignisarten ausgelöst; Punkte ' + g.score + ', ' + g.missions.length + ' Ziele, Lage: ' + GPHASE[g.phase].n;
  });
}
